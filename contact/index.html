<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Asap+Condensed:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Belanosima:wght@400;600;700&family=Boogaloo&family=Bungee&family=Cabin+Sketch:wght@400;700&family=Caveat:wght@400..700&family=DM+Serif+Display:ital@0;1&family=DM+Serif+Text:ital@0;1&family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Heebo:wght@100..900&family=Kalam:wght@300;400;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nova+Mono&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Rampart+One&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik+Dirt&family=Story+Script&family=WindSong:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css" class="css">
    <title>Contato</title>
</head>
<body>
    <header>
        <div class="container">
            <nav class="menu-desktop">
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#grafico">Design Gráfico</a></li>
                    <li><a href="#uiux">UI/UX Design</a></li>
                </ul>
            </nav>

            <div class="btn-contato">
                <a href="../../contact/index.html">
                    <button>Contato</button>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="title">
            <h1>Olá!</h1>
            
            <div class="container-social">
                <a href="https://www.linkedin.com/in/henriquesantosdev/" target="_blank"><i class='bx bxl-linkedin'></i></a>
                <a href="https://github.com/HenriqueSantosDev" target="_blank"><i class='bx bxl-github'></i></a>
                <a href="mailto:henriquesantosdev@gmail.com" target="_blank"><i class='bx bxl-gmail'></i></a>
            </div>
        </section>

        <section class="container-inputs">
            <div class="inputs">
                <form>
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" placeholder="Seu nome completo" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Seu melhor email" required>

                    <label for="message">Mensagem</label>
                    <textarea id="message" name="message" placeholder="Escreva sua mensagem aqui..." required></textarea>

                    <button type="submit">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container-footer">
            <p>Criado por Henrique Santos</p>
        </div>
    </footer>
</body>
</html>
